name: Publish static GitHub Pages site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-pages-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    env:
      PAGES_ARTIFACT_NAME: pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the published site
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify site entry points
        run: |
          test -f .nojekyll
          test -f index.html
          test -d privacy
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload the complete static site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: .
      - name: Wait for the Pages artifact to be indexed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '/artifacts?per_page=100'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Cache-Control': 'no-cache'}
          for attempt in range(10):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=15) as response:
                  artifacts = json.load(response).get('artifacts', [])
              matches = [a for a in artifacts if a['name'] == os.environ['PAGES_ARTIFACT_NAME'] and not a['expired']]
              if len(matches) == 1:
                  print('Pages artifact is indexed and ready.')
                  break
              if len(matches) > 1:
                  raise SystemExit('Multiple artifacts unexpectedly share this attempt name.')
              if attempt == 9:
                  raise SystemExit('The uploaded Pages artifact is not yet indexed. Retry this job.')
              time.sleep(5)
          PY
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
          timeout: 600000
